[build-system]
requires = ["setuptools>=68.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lare"
version = "1.2.2"
description = "Label Auditing & Reclassification Environment"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "click>=8.1",
    "polars>=1.0",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.0",
    "tomli>=2.0; python_version < '3.11'",
    "tomli-w>=1.0",
    "rich>=13.0",
    "questionary>=2.0",
]

[project.optional-dependencies]
fits = ["astropy>=6.1.0", "numpy>=1.26", "matplotlib>=3.8"]

[project.scripts]
lare = "lare.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lare = ["static/**/*"]
